# Tool-permission manifest for vs-tipi custom agents.
#
# Declarative source of truth for which tools each agent is allowed to use.
# Validator (scripts/validate_plugin.py) cross-checks each *.agent.md against
# this file and fails CI if an agent's `tools:` list drifts out of policy.
#
# Scope of tools by role:
#   - @fleet   — MINIMAL Dramatis-facing router. Reads substrate/sinew state,
#                can broadcast, and hands off. No dev tools.
#   - @hermes  — Actor view over Hermes runtime. Consciousness reads + dispatch.
#   - @olivier_mbp — Actor view over local OpenClaw. Same pattern as @hermes.
#   - @kimiclaw — Actor view over cloud OpenClaw. Same pattern as @hermes.
#   - @pt      — Dissent/review actor. Consciousness reads + execute for Gemini CLI.
#   - @claude-new — Spawn fresh Claude Code worker. HEAVY dev toolset because
#                   the spawned worker may run implementation work.
#
# Architecture rule:
#   VS Tipi agents are actor views inside the Agentic OS. They do not own work
#   records, public Telegram identities, or the workflow engine. Linear/Beads
#   remember, Dramatis decides, Sinew connects, n8n executes, rbitr records/spawns,
#   ContextForge/Bifrost expose tools, Uptime Kuma observes, Cortex carries
#   context, RepoWeaver explains the fleet, and GitNexus explains symbols when
#   healthy.
#
# Categories:
#   - mcp-wildcard: "server-name/*" (grants all tools on that MCP server)
#   - mcp-tool:     "server-name/tool_name" (one specific tool)
#   - vscode-core:  "vscode", "execute", "read", "agent", "browser", "new", "todo"
#   - vscode-ext:   "<publisher>.<extension>/<tool>" (e.g. ms-python.python/...)
#
# When the validator runs, each agent's `tools:` list must be a SUBSET of
# the tools allowed here for that agent. Extra tools on an agent = CI failure.
# Missing tools = warning (the agent has fewer permissions than the policy allows).

version: 1

agents:
  fleet:
    description: Dramatis-facing routing meta-agent — minimal permissions, reads substrate/sinew state + broadcasts
    allowed:
      # MCP: read-only consciousness + broadcast for routing announcements
      - tipi-consciousness/*
      - tipi-dizzy/*
      - nate-promptkit/*
      # VS Code core chat primitives — routing agent needs to read files + run basic commands
      - vscode
      - read
      - agent
      - todo

  hermes:
    description: Actor view over Hermes runtime — consciousness reads + hermes dispatch
    allowed:
      - tipi-hermes/*
      - tipi-consciousness/search_beliefs
      - tipi-consciousness/search_mind
      - tipi-consciousness/body_state
      - vscode
      - read

  olivier_mbp:
    description: Actor view over OLIVIER_MBP (local OpenClaw on MacBook Pro) — consciousness reads + openclaw dispatch
    allowed:
      - tipi-openclaw/dispatch_to_olivier_mbp
      - tipi-consciousness/search_beliefs
      - tipi-consciousness/search_mind
      - tipi-consciousness/body_state
      - vscode
      - read

  kimiclaw:
    description: Actor view over KimiClaw (cloud OpenClaw) — consciousness reads + openclaw dispatch
    allowed:
      - tipi-openclaw/dispatch_to_kimiclaw
      - tipi-consciousness/search_beliefs
      - tipi-consciousness/search_mind
      - vscode
      - read

  pt:
    description: Actor view over PT (local Gemini CLI runtime, former surface Neo) — consciousness reads + shell-out via execute primitive (no tipi-pt MCP yet)
    allowed:
      - tipi-consciousness/search_beliefs
      - tipi-consciousness/search_mind
      - tipi-consciousness/body_state
      - vscode
      - read
      - execute

  claude-new:
    description: Spawn fresh Claude Code worker — heavy dev toolset for the worker to use
    allowed:
      # MCP: full access to fleet + consciousness (spawned sessions may need it)
      - tipi-claude-spawn/*
      - tipi-consciousness/*
      - tipi-dizzy/*
      - agentic-coding-school/*
      - nate-promptkit/*
      # VS Code core chat primitives
      - vscode
      - execute
      - read
      - agent
      - browser
      - new
      - todo
      # Extension tools — Python env management (tipi is Python-based)
      - ms-python.python/getPythonEnvironmentInfo
      - ms-python.python/getPythonExecutableCommand
      - ms-python.python/installPythonPackage
      - ms-python.python/configurePythonEnvironment
      # Jupyter — for any notebook-style exploration in spawned sessions
      - ms-toolsai.jupyter/configureNotebook
      - ms-toolsai.jupyter/listNotebookPackages
      - ms-toolsai.jupyter/installNotebookPackages
      # Diagram rendering — useful for explaining code changes
      - vscode.mermaid-chat-features/renderMermaidDiagram
      # Container config — spawned sessions may touch containerized infra
      - ms-azuretools.vscode-containers/containerToolsConfig
